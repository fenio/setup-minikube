name: 'Setup minikube for self-hosted GH runners'
description: 'Install and configure minikube - Local Kubernetes for CI/CD'
author: 'fenio'

branding:
  icon: 'box'
  color: 'blue'

inputs:
  version:
    description: 'minikube version to install (e.g., v1.32.0, latest, or stable)'
    required: false
    default: 'stable'
  
  kubernetes-version:
    description: 'Kubernetes version to use (e.g., v1.28.3, stable, latest)'
    required: false
    default: 'stable'
  
  driver:
    description: 'Driver to use (docker, none, podman)'
    required: false
    default: 'docker'
  
  container-runtime:
    description: 'Container runtime to use (docker, containerd, cri-o)'
    required: false
    default: ''
  
  wait-for-ready:
    description: 'Wait for minikube cluster to be ready before completing'
    required: false
    default: 'true'
  
  timeout:
    description: 'Timeout in seconds to wait for cluster readiness'
    required: false
    default: '120'

outputs:
  kubeconfig:
    description: 'Path to the kubeconfig file'
    value: ${{ steps.setup.outputs.kubeconfig }}

runs:
  using: 'composite'
  steps:
    - name: Setup Minikube
      id: setup
      shell: bash
      run: ${{ github.action_path }}/setup.sh
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_KUBERNETES_VERSION: ${{ inputs.kubernetes-version }}
        INPUT_DRIVER: ${{ inputs.driver }}
        INPUT_CONTAINER_RUNTIME: ${{ inputs.container-runtime }}
        INPUT_WAIT_FOR_READY: ${{ inputs.wait-for-ready }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
